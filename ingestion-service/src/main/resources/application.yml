server:
  port: 8080

spring:
  application:
    name: ingestion-service
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: postgres
    password: secretpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

aws:
  sqs:
    endpoint: http://localhost:4566 # LocalStack endpoint
    queue-url: http://localhost:4566/000000000000/transaction-notifications.fifo

cloud:
  aws:
    region:
      static: us-east-1
    credentials:
      access-key: test
      secret-key: test