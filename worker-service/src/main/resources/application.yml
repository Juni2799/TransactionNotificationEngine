server:
  port: 8081

spring:
  application:
    name: worker-service
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: postgres
    password: secretpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    aws:
      endpoint: http://localhost:4566
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test

aws:
  sqs:
    queue-name: transaction-notifications.fifo
  s3:
    archival-bucket: transaction-archives-bucket

archival:
  retention-days: 30 # Archive terminal records older than 30 days
  cron-expression: "0 0 2 * * ?" # Run daily at 2:00 AM (or can be set to run more frequently for testing)
